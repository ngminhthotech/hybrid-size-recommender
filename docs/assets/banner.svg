<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Hybrid Size Recommender">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9dff"/>
      <stop offset="1" stop-color="#36d1a6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect x="64" y="64" width="56" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#8fb4e8" font-size="16" font-weight="600" letter-spacing="2.5">RECOMMENDER SYSTEMS · FASHION E-COMMERCE</text>
    <text x="64" y="172" fill="#ffffff" font-size="50" font-weight="700">Hybrid Size Recommender</text>
    <text x="64" y="212" fill="#c9d6ea" font-size="20">Body measurements + purchase history → the right size,</text>
    <text x="64" y="240" fill="#c9d6ea" font-size="20">from a shopper's very first visit.</text>

    <g font-size="14" font-weight="600">
      <rect x="64" y="268" width="122" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4f9dff" stroke-opacity="0.6"/>
      <text x="125" y="288" fill="#cfe2ff" text-anchor="middle">Cold-start</text>
      <rect x="196" y="268" width="152" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4f9dff" stroke-opacity="0.6"/>
      <text x="272" y="288" fill="#cfe2ff" text-anchor="middle">Ordinal hybrid MF</text>
      <rect x="358" y="268" width="96" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4f9dff" stroke-opacity="0.6"/>
      <text x="406" y="288" fill="#cfe2ff" text-anchor="middle">PyTorch</text>
      <rect x="464" y="268" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4f9dff" stroke-opacity="0.6"/>
      <text x="539" y="288" fill="#cfe2ff" text-anchor="middle">10-seed evaluated</text>
    </g>

    <!-- recommendation card -->
    <g transform="translate(820,58)">
      <rect width="396" height="224" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="24" y="38" fill="#8fb4e8" font-size="13" font-weight="600" letter-spacing="1.5">NEW SHOPPER · 165 CM · 57 KG · 34B</text>
      <text x="24" y="70" fill="#c9d6ea" font-size="15">Available sizes</text>
      <g font-size="17" font-weight="700" text-anchor="middle">
        <rect x="24" y="84" width="58" height="44" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="53" y="112" fill="#9fb2cc">4</text>
        <rect x="92" y="84" width="58" height="44" rx="8" fill="url(#accent)"/>
        <text x="121" y="112" fill="#0b1220">8</text>
        <rect x="160" y="84" width="58" height="44" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="189" y="112" fill="#9fb2cc">12</text>
        <rect x="228" y="84" width="58" height="44" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="257" y="112" fill="#9fb2cc">16</text>
        <rect x="296" y="84" width="58" height="44" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="325" y="112" fill="#9fb2cc">20</text>
      </g>
      <text x="24" y="160" fill="#ffffff" font-size="16" font-weight="600">Recommended size 8</text>
      <g transform="translate(24,174)">
        <rect width="348" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
        <rect width="81" height="10" rx="5" fill="#eb6834"/>
        <rect x="81" width="164" height="10" fill="#36d1a6"/>
        <rect x="245" width="103" height="10" rx="5" fill="#4f9dff"/>
      </g>
      <g font-size="12" fill="#c9d6ea">
        <text x="24" y="206">tight 23%</text>
        <text x="152" y="206">fit 47%</text>
        <text x="300" y="206">loose 30%</text>
      </g>
    </g>
  </g>
</svg>
