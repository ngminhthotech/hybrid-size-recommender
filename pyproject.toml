[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sizerec"
version = "1.0.0"
description = "Hybrid ordinal matrix factorization for apparel size recommendation (cold-start)"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy", "torch", "rich"]

[project.scripts]
sizerec = "sizerec.cli:main"

[tool.setuptools]
packages = ["sizerec"]
